# Cloudflare configuration. Deploy from the repository root:  npx wrangler deploy
name = "tower-of-poop"
main = "worker/worker.js"
compatibility_date = "2025-02-24"
# keep variables set in the Cloudflare dashboard (e.g. STATS_KEY) when deploying
keep_vars = true

[assets]
directory = "./worker/www"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Stats"]
