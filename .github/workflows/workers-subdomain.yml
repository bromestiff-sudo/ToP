# Changes the account's workers.dev subdomain (the "xxx" in tower-of-poop.xxx.workers.dev).
# Run it from GitHub: Actions -> "Change workers.dev subdomain" -> Run workflow.
# Needs two repository secrets: CF_API_TOKEN (Workers Scripts: Edit) and CF_ACCOUNT_ID.
name: Change workers.dev subdomain
on:
  workflow_dispatch:
    inputs:
      subdomain:
        description: "New subdomain (lowercase letters, digits, hyphens)"
        required: true
jobs:
  change:
    runs-on: ubuntu-latest
    steps:
      - name: Check the name
        env:
          SUB: ${{ inputs.subdomain }}
        run: |
          echo "$SUB" | grep -Eq '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' || { echo "Invalid name: use lowercase letters, digits and hyphens"; exit 1; }
      - name: Current subdomain
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CF_API_TOKEN" | python3 -c "import json,sys;d=json.load(sys.stdin);print('success:',d.get('success'),'| current:',(d.get('result') or {}).get('subdomain'),'| errors:',d.get('errors'))"
      - name: Change it
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SUB: ${{ inputs.subdomain }}
        run: |
          curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" \
            --data "{\"subdomain\":\"$SUB\"}" > out.json
          python3 -c "import json;d=json.load(open('out.json'));print('success:',d.get('success'),'| errors:',d.get('errors'));import sys;sys.exit(0 if d.get('success') else 1)"
          echo "New address: https://tower-of-poop.$SUB.workers.dev (allow a few minutes)"
